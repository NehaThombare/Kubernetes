kind: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
metadata:
  name: notes-app-hpa
  namespace: nginx

spec:
  scaleTargetRef:
    kind: Deployment
    name: notes-app-deployment
    apiVersion: apps/v1
   
  minReplicas: 1     #Normal traffic 1 pod
  maxReplicas: 5      #When traffic increases 5 pods should run

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:                     
          type: Utilization  #When utilization of cpu reaches 5% then create replicas
          averageUtilization: 5
