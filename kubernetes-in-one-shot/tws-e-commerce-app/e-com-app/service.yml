kind: Service
apiVersion: v1
metadata:
  name: e-com-app
  namespace: nginx
spec:
  selector:
    app: e-com-app # Now matches your fixed deployment label perfectly!
  ports:
  - protocol: TCP
    port: 8000        # The entry port exposed by the service inside the cluster
    targetPort: 3000    # Points directly to the containerPort 3000 in your deployment
  type: ClusterIP
