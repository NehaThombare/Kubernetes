kind: CustomResourceDefinition
apiVersion: apiextensions.k8s.io/v1
metadata:
  name: devopsbatches.neha.com     #you need to write the grp name too
spec:
  group: neha.com    #apiVersion for files neha.com/v1
  names:
    plural: devopsbatches
    singular: devopsbatch
    kind: DevOpsBatch    #use this in your files in KIND section
    shortNames:
      - batch
      - dev
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              name:
                type: string
                description: "This is name of devops batch"
              duration:
                type: string
                description: "duration of devops batch"
              mode:
                type: string
                description: "mode of the batch ex. live or recorded"
              platform:
                type: string
                description: "this is the platform of batch"
